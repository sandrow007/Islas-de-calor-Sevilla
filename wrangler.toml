name = "manolito-infinito"
main = "src/index.js"
compatibility_date = "2024-07-21"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[assets]
binding = "ASSETS"
directory = "."

routes = [
  { pattern = "islasdecalorsevilla.com", custom_domain = true },
  { pattern = "www.islasdecalorsevilla.com", custom_domain = true },
  { pattern = "islasdecalorsevilla.com/*", zone_name = "islasdecalorsevilla.com" },
  { pattern = "*islasdecalorsevilla.com/*", zone_name = "islasdecalorsevilla.com" }
]
